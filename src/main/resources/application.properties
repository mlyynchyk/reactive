spring.application.name=reactive

# R2DBC - реактивне підключення до PostgreSQL (для роботи програми)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/${DB_NAME:reactive}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}

# Flyway - звичайне JDBC-підключення (лише для міграцій)
spring.flyway.url=jdbc:postgresql://localhost:5432/${DB_NAME:reactive}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}
spring.flyway.locations=classpath:db/migration
